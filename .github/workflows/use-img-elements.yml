name: Use image elements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace CSS backgrounds with img elements
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          css = Path('style.css').read_text()

          html = html.replace(
              '<div class="hero-photo" role="img" aria-label="The Lakes Barbershop storefront at dusk"></div><div class="hero-shade"></div>',
              '<img class="hero-photo" src="images/shop-exterior.jpeg" alt="The Lakes Barbershop storefront at dusk"><div class="hero-shade"></div>'
          )
          html = html.replace(
              '<section class="shop-section" id="shop"><div class="shop-image" role="img" aria-label="The Lakes Barbershop waiting area with orange walls, corrugated steel, guitar, and lounge chairs"></div>',
              '<section class="shop-section" id="shop"><div class="shop-image"><img src="images/shop-interior.jpeg" alt="The Lakes Barbershop waiting area with orange walls, corrugated steel, guitar, and lounge chairs"></div>'
          )

          css = css.replace(
              ".hero-photo { position: absolute; inset: 0; background: url('images/shop-exterior.jpeg') center/cover no-repeat; }",
              ".hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }"
          )
          css = css.replace(
              ".shop-image { min-height: 620px; background: linear-gradient(0deg, rgba(4,6,8,.35), transparent 55%), url('images/shop-interior.jpeg') center/cover no-repeat; }",
              ".shop-image { position: relative; min-height: 620px; overflow: hidden; }\n.shop-image img { width: 100%; height: 100%; min-height: 620px; object-fit: cover; object-position: center; }"
          )
          css = css.replace(
              ".hero-photo { background-position: 63% center; }",
              ".hero-photo { object-position: 63% center; }"
          )
          css = css.replace(
              ".shop-image { min-height: 560px; }",
              ".shop-image, .shop-image img { min-height: 560px; }"
          )
          css = css.replace(
              ".shop-image { min-height: 460px; }",
              ".shop-image, .shop-image img { min-height: 460px; }"
          )

          Path('index.html').write_text(html)
          Path('style.css').write_text(css)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet || git commit -m "Render Lakes photos as img elements"
          git push
